<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Level Up AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 50px auto; background-color: #1f1f1f; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #00e676; text-align: center; margin-bottom: 30px; }
        form { display: grid; gap: 15px; }
        label { font-weight: bold; color: #bbb; }
        .error-message { margin-bottom: 15px; padding: 12px 15px; border-radius: 8px; background: #ff3d00; color: white; font-weight: bold; }
        input, select { padding: 12px; border-radius: 6px; border: 1px solid #333; background-color: #2c2c2c; color: white; }
        input:focus { outline: none; border-color: #00e676; }
        button { padding: 15px; background-color: #00e676; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00c853; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #00e676; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>👤 User Registration</h2>
    <form action="/user_registration" method="POST">
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required value="{{ form_data.username|default('') }}">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter full name" required value="{{ form_data.full_name|default('') }}">
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required value="{{ form_data.email|default('') }}">
        
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter age" value="{{ form_data.age|default('') }}">
        
        <label for="weight">Weight (kg)</label>
        <input type="number" step="0.01" id="weight" name="weight" placeholder="Enter weight" value="{{ form_data.weight|default('') }}">
        
        <label for="height">Height (cm)</label>
        <input type="number" step="0.01" id="height" name="height" placeholder="Enter height" value="{{ form_data.height|default('') }}">
        
        <label for="fitness_level">Fitness Level</label>
        <select id="fitness_level" name="fitness_level">
            <option value="Beginner" {% if form_data.fitness_level == 'Beginner' %}selected{% endif %}>Beginner</option>
            <option value="Intermediate" {% if form_data.fitness_level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
            <option value="Advanced" {% if form_data.fitness_level == 'Advanced' %}selected{% endif %}>Advanced</option>
        </select>
        
        <button type="submit">Level Up Now!</button>
    </form>
    <a href="/" class="back-link">⬅ Back to Dashboard</a>
</div>

</body>
</html>
