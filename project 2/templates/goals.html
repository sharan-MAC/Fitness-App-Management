<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Goals - Level Up AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 50px auto; background-color: #1f1f1f; padding: 30px; border-radius: 12px; }
        h2 { color: #00e676; text-align: center; }
        .goal-form { background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, button { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #121212; color: white; }
        button { background: #00e676; color: black; font-weight: bold; border: none; grid-column: span 2; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #333; text-align: left; }
        th { color: #00e676; }
        .status-active { color: #00e676; }
        .status-completed { color: #2196f3; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #00e676; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 My Fitness Goals</h2>
    
    <div class="goal-form">
        <h3 style="grid-column: span 2;">Set a New Goal</h3>
        <input type="number" name="user_id" placeholder="User ID" required>
        <input type="text" name="goal_name" placeholder="Goal (e.g. Lost 5kg)" required>
        <input type="number" step="0.01" name="target_value" placeholder="Target Value" required>
        <input type="date" name="deadline" required>
        <form action="/goals" method="POST" style="display: contents;">
            <!-- Re-attaching to form structure correctly -->
            <input type="hidden" name="dummy" value="1"> 
        </form>
        <!-- Correcting form structure below -->
    </div>

    <!-- Fix form structure -->
    <script>
        // Oops, let's just make a simple form instead of grid display if complicated
    </script>

    <div style="background: #2c2c2c; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
        <form action="/goals" method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="number" name="user_id" placeholder="User ID" required>
            <input type="text" name="goal_name" placeholder="Goal" required>
            <input type="number" step="0.01" name="target_value" placeholder="Target" required>
            <input type="date" name="deadline" required>
            <button type="submit" style="grid-column: span 2;">Add Goal</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>Athlete</th>
                <th>Goal</th>
                <th>Target</th>
                <th>Current</th>
                <th>Status</th>
                <th>Update</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for goal in goals %}
            <tr>
                <td>{{ goal.username }}</td>
                <td>{{ goal.goal_name }}</td>
                <td>{{ goal.target_value }}</td>
                <td>{{ goal.current_value }}</td>
                <td class="status-{{ goal.status }}">{{ goal.status.upper() }}</td>
                <td>
                    <form action="/goal_update/{{ goal.goal_id }}" method="POST" style="display: flex; gap: 5px;">
                        <input type="number" step="0.01" name="current_value" value="{{ goal.current_value }}" style="width: 60px; padding: 5px;">
                        <select name="status" style="width: 80px; padding: 5px;">
                            <option value="active" {% if goal.status == 'active' %}selected{% endif %}>Active</option>
                            <option value="completed" {% if goal.status == 'completed' %}selected{% endif %}>Done</option>
                            <option value="failed" {% if goal.status == 'failed' %}selected{% endif %}>Failed</option>
                        </select>
                        <button type="submit" style="background: #2196f3; padding: 5px; font-size: 0.7rem; color: white;">💾</button>
                    </form>
                </td>
                <td>
                    <a href="/goals" style="color: #f44336;">🗑</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
    <a href="/" class="back-link">⬅ Back to Dashboard</a>
</div>

</body>
</html>
